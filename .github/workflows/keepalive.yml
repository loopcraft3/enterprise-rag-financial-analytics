name: Keep backend and database awake

on:
  schedule:
    - cron: "0 6 */2 * *"   # every 2 days at 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health endpoint (touches the database)
        run: |
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 30 --max-time 120 \
               "https://enterprise-rag-financial-analytics.onrender.com/health/db"